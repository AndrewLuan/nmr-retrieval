name: Assignment contracts

on:
  push:
    branches: [main]
    paths:
      - 'nmr_assignment/**'
      - 'tests/assignment/**'
      - 'research/peak_assignment/**'
      - '.github/workflows/assignment.yml'
  pull_request:
    paths:
      - 'nmr_assignment/**'
      - 'tests/assignment/**'
      - 'research/peak_assignment/**'
      - '.github/workflows/assignment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install component dependencies
        run: python -m pip install scipy==1.17.1 rdkit==2026.3.6 psutil==7.2.2
      - name: Check synthetic assignment contracts
        run: python -B -m unittest discover -s tests/assignment -v
      - name: Check public outer-source interfaces
        run: python -B research/peak_assignment/synthetic_checks.py
